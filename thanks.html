<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Biswajit Sahoo</title>

    <meta http-equiv="refresh" content="8;url=https://bsahoo8342.github.io/resume/">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .thank-you-card {
            background: #fff;
            padding: 3rem;
            border-radius: 6px;
            border: 1px solid #e0e4e8;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .thank-you-card h1 {
            color: #004b87;
            margin-bottom: 1rem;
        }

        .thank-you-card p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn-home {
            background-color: #004b87;
            color: white;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-home:hover {
            background-color: #00335e;
        }

        .timer {
            font-weight: bold;
            color: #004b87;
        }
    </style>
</head>

<body>

    <div class="thank-you-card">
        <h1>Thank You!</h1>
        <p>Your message has been successfully sent. I will get back to you as soon as possible.</p>
        <p>You will be redirected to the homepage in <span class="timer" id="countdown">8</span> seconds.</p>
        <a href="https://bsahoo8342.github.io/resume/" class="btn-home">Return to Homepage Now</a>
    </div>

    <!-- Optional JavaScript to show the countdown visually -->
    <script>
        let timeLeft = 8;
        const countdownElement = document.getElementById('countdown');
        const timer = setInterval(function () {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
            }
        }, 1000);
    </script>

</body>

</html>
